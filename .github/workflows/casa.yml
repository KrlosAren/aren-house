name: casa — build multi-arch

# Imagen de apps/casa → ghcr.io/krlosaren/aren-house-casa:<sha>
# Corre en runners de GitHub (no en el self-hosted): no toca el homelab, solo publica la imagen.
# El despliegue es manual: cambiar el tag en k8s-apps/casa/01-casa-deployment.yml.
on:
  push:
    branches: [main]
    paths:
      - "apps/casa/**"
      - ".github/workflows/casa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Solo el owner, solo en este repo (mismo criterio que test-app.yml)
    if: github.repository == 'KrlosAren/aren-house' && github.actor == 'KrlosAren'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push (arm64 + amd64, cross-compile sin QEMU)
        uses: docker/build-push-action@v6
        with:
          context: apps/casa
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/krlosaren/aren-house-casa:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          echo "### Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/krlosaren/aren-house-casa:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
