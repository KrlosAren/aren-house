# 02-prometheus-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
      evaluation_interval: 30s
      sample_limit: 30000

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.monitoring.svc.cluster.local:9093

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # Métricas de la API server de k3s
      - job_name: 'kubernetes-apiservers'
        sample_limit: 150000
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'apiserver_(request_total|request_duration_seconds.*|current_inflight_requests|dropped_requests_total)|etcd_(request_duration_seconds.*|object_counts)|process_(cpu_seconds_total|resident_memory_bytes)|up'
            action: keep

      # Métricas de los nodos (kubelet)
      - job_name: 'kubernetes-nodes'
        sample_limit: 150000
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'kubelet_(running_pods|running_containers|volume_stats.*|node_config_error|runtime_operations_total|runtime_operations_errors_total)|process_(cpu_seconds_total|resident_memory_bytes)|storage_operation_(duration_seconds.*|errors_total)|volume_manager_total_volumes|up'
            action: keep

      # Métricas de los contenedores (cAdvisor integrado en kubelet)
      - job_name: 'kubernetes-cadvisor'
        sample_limit: 80000
        honor_timestamps: true
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/cadvisor
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes|network_receive_bytes_total|network_transmit_bytes_total|fs_usage_bytes|fs_limit_bytes)'
            action: keep

      # Auto-descubrimiento de pods con annotation prometheus.io/scrape: "true"
      - job_name: 'kubernetes-pods'
        sample_limit: 80000
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # Node exporters
      - job_name: 'node-exporter'
        static_configs:
          - targets:
              - "10.0.0.1:9100"
              - "10.0.0.2:9100"
              - "10.0.0.3:9100"
            labels:
              env: 'homelab'

      # Blackbox — probe SSH (puerto 22 de cada nodo)
      - job_name: 'blackbox-ssh'
        metrics_path: /probe
        params:
          module: [ssh_banner]
        static_configs:
          - targets:
              - "10.0.0.1:22"   # rp1-master
              - "10.0.0.2:22"   # rp2-node
              - "10.0.0.3:22"   # rp3-node
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc.cluster.local:9115
          - source_labels: [instance]
            regex: '10\.0\.0\.1:22'
            target_label: node
            replacement: rp1-master
          - source_labels: [instance]
            regex: '10\.0\.0\.2:22'
            target_label: node
            replacement: rp2-node
          - source_labels: [instance]
            regex: '10\.0\.0\.3:22'
            target_label: node
            replacement: rp3-node

      # Blackbox — ICMP ping a cada nodo
      - job_name: 'blackbox-icmp'
        metrics_path: /probe
        params:
          module: [icmp_ping]
        static_configs:
          - targets:
              - "10.0.0.1"   # rp1-master
              - "10.0.0.2"   # rp2-node
              - "10.0.0.3"   # rp3-node
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc.cluster.local:9115
          - source_labels: [instance]
            regex: '10\.0\.0\.1'
            target_label: node
            replacement: rp1-master
          - source_labels: [instance]
            regex: '10\.0\.0\.2'
            target_label: node
            replacement: rp2-node
          - source_labels: [instance]
            regex: '10\.0\.0\.3'
            target_label: node
            replacement: rp3-node
      
      ## itself
      - job_name: 'prometheus'
        static_configs:
          - targets:
              - "localhost:9090"

      ## alertmanager
      - job_name: 'alertmanager'
        static_configs:
          - targets:
              - "alertmanager.monitoring.svc.cluster.local:9093"
