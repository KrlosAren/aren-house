apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      nodeSelector:
        kubernetes.io/hostname: rp3-node   # PV local-path vive aquí
      terminationGracePeriodSeconds: 120
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.34.2
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--web.external-url=https://alertmanager.tailb0ca85.ts.net"
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: storage
              mountPath: /alertmanager
            - name: ntfy-token        # token ntfy (usuario alertmanager, write-only en "alertas")
              mountPath: /etc/alertmanager/secrets
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: storage
          persistentVolumeClaim:
            claimName: alertmanager-pvc
        # projected: dos Secrets (creados a mano, NO en git) en /etc/alertmanager/secrets
        #   token            ← alertmanager-ntfy
        #   healthchecks-url ← alertmanager-healthchecks
        - name: ntfy-token
          projected:
            sources:
              - secret:
                  name: alertmanager-ntfy
              - secret:
                  name: alertmanager-healthchecks
