apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    # Severidad → prioridad ntfy (1 min … 5 max). Reglas en prometheus/09-prometheus-rules.yml
    route:
      group_by: ['alertname', 'node']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'ntfy'                 # warning → prioridad normal (3)
      routes:
        # Dead man's switch → Healthchecks.io (externo). Va PRIMERO y no continúa:
        # nunca llega a ntfy. Healthchecks: período 5 min, gracia 10 min.
        - matchers: [alertname="Watchdog"]
          receiver: 'healthchecks'
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 5m
        - matchers: [severity="critical"]
          receiver: 'ntfy-critico'
          repeat_interval: 1h          # recordar más seguido lo urgente
        - matchers: [severity="info"]
          receiver: 'ntfy-info'
          repeat_interval: 24h

    # ntfy self-hosted, plantilla nativa ?template=alertmanager.
    # Token: usuario ntfy "alertmanager", write-only en topic "alertas". Secret creado a mano:
    #   kubectl exec -n ntfy deploy/ntfy -- ntfy token add --label=alertmanager alertmanager
    #   kubectl create secret generic alertmanager-ntfy -n monitoring --from-literal=token=tk_...
    receivers:
      - name: 'ntfy'
        webhook_configs:
          - url: 'http://ntfy.ntfy.svc.cluster.local/alertas?template=alertmanager'
            send_resolved: true
            http_config: &ntfy_auth
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/token
      - name: 'ntfy-critico'
        webhook_configs:
          - url: 'http://ntfy.ntfy.svc.cluster.local/alertas?template=alertmanager&priority=5&tags=rotating_light'
            send_resolved: true
            http_config: *ntfy_auth
      # URL de ping (contiene el UUID = credencial) en Secret creado a mano, NO en git:
      #   kubectl create secret generic alertmanager-healthchecks -n monitoring --from-file=healthchecks-url=<archivo con la URL>
      - name: 'healthchecks'
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/healthchecks-url
            send_resolved: false
      - name: 'ntfy-info'
        webhook_configs:
          - url: 'http://ntfy.ntfy.svc.cluster.local/alertas?template=alertmanager&priority=2'
            send_resolved: false       # "se reinició" no necesita aviso de resolución
            http_config: *ntfy_auth

    inhibit_rules:
      # Nodo caído → silenciar el resto de alertas de ese nodo (servicios, probes, etc.)
      - source_matchers: [alertname="NodoSinRespuesta"]
        target_matchers: [alertname!="NodoSinRespuesta"]
        equal: ['node']
      # Crítica de temperatura → no repetir la warning
      - source_matchers: [alertname="TemperaturaCritica"]
        target_matchers: [alertname="TemperaturaAlta"]
        equal: ['node']
      # Misma alerta en critical y warning → solo la critical
      - source_matchers: [severity="critical"]
        target_matchers: [severity="warning"]
        equal: ['alertname', 'node']
