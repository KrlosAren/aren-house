apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'instance']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default'

    receivers:
      # ntfy self-hosted (antes: topic público en ntfy.sh). Plantilla nativa de ntfy para Alertmanager.
      # Token: usuario ntfy "alertmanager", write-only en topic "alertas". Secret creado a mano:
      #   kubectl exec -n ntfy deploy/ntfy -- ntfy token add --label=alertmanager alertmanager
      #   kubectl create secret generic alertmanager-ntfy -n monitoring --from-literal=token=tk_...
      - name: 'default'
        webhook_configs:
          - url: 'http://ntfy.ntfy.svc.cluster.local/alertas?template=alertmanager'
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/token
            
    inhibit_rules:
      - source_matchers: [severity="critical"]
        target_matchers: [severity="warning"]
        equal: ['alertname', 'instance']
