apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: ntfy
data:
  server.yml: |
    # Acceso solo via Tailscale (Tailscale Service svc:ntfy en rp1) — sin Ingress
    base-url: "https://ntfy.tailb0ca85.ts.net"
    behind-proxy: true

    cache-file: /var/cache/ntfy/cache.db
    cache-duration: 12h

    # Adjuntos: snapshots de Frigate en las notificaciones
    attachment-cache-dir: /var/cache/ntfy/attachments
    attachment-total-size-limit: 1G
    attachment-file-size-limit: 5M
    attachment-expiry-duration: 72h

    auth-file: /var/lib/ntfy/user.db
    auth-default-access: deny-all

    # iOS: Apple solo entrega push vía APNs. ntfy.sh recibe un "poll request"
    # con el ID del mensaje (NO el contenido) y despierta la app, que luego
    # descarga el mensaje desde este servidor.
    upstream-base-url: "https://ntfy.sh"
