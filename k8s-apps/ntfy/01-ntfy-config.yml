apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: ntfy
data:
  server.yml: |
    # Acceso solo via Tailscale (tailscale serve en rp1, puerto 8444) — sin Ingress
    base-url: "https://rp1-master.tailb0ca85.ts.net:8444"
    behind-proxy: true

    cache-file: /var/cache/ntfy/cache.db
    cache-duration: 12h

    auth-file: /var/lib/ntfy/user.db
    auth-default-access: deny-all

    # iOS: Apple solo entrega push vía APNs. ntfy.sh recibe un "poll request"
    # con el ID del mensaje (NO el contenido) y despierta la app, que luego
    # descarga el mensaje desde este servidor.
    upstream-base-url: "https://ntfy.sh"
