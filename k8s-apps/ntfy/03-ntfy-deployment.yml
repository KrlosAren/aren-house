apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
spec:
  replicas: 1
  # Recreate: PVC ReadWriteOnce (SQLite (user.db, cache.db)). Con RollingUpdate el pod nuevo arranca
  # antes de que muera el viejo y choca con el bloqueo del almacenamiento (CrashLoop).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      nodeSelector:
        kubernetes.io/hostname: rp3-node   # worker con SSD; el PV local-path vive en este nodo
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.37.2
          args: ["serve", "--config", "/etc/ntfy/server.yml"]
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy
            - name: data
              mountPath: /var/lib/ntfy
            - name: data
              mountPath: /var/cache/ntfy
              subPath: cache
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: ntfy-config
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-pvc
