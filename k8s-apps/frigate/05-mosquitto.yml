# Broker MQTT para eventos de Frigate. Solo ClusterIP (sin Ingress ni tailscale serve):
# únicamente pods del cluster pueden conectarse → anónimo aceptable en este alcance.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: cameras
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence false
    log_dest stdout
    log_type error
    log_type warning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: cameras
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.23
          ports:
            - name: mqtt
              containerPort: 1883
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
          readinessProbe:
            tcpSocket:
              port: mqtt
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: cameras
spec:
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
