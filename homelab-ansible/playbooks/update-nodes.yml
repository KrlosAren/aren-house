---
# Playbook: update-nodes.yml
# Propósito: Actualizar paquetes en los nodos (seguro para NFS boot)
#
# Uso:
#   ansible-playbook playbooks/update-nodes.yml                    # Todos los nodos
#   ansible-playbook playbooks/update-nodes.yml --limit rp2-node   # Solo rp2
#   ansible-playbook playbooks/update-nodes.yml -e "reboot=true"   # Con reinicio

- name: Actualizar nodos
  hosts: nodes
  become: yes
  serial: 1  # Un nodo a la vez

  vars:
    reboot: false

  tasks:
    # ============================================================
    # PASO 1: Pre-requisitos para NFS boot
    # ============================================================
    - name: Sincronizar tiempo (NFS boot pierde hora al reiniciar)
      command: chronyc makestep
      ignore_errors: yes
      changed_when: false

    - name: Verificar que flash-kernel está en hold
      command: apt-mark showhold
      register: hold_list
      changed_when: false

    - name: Marcar flash-kernel como hold si no lo está
      command: apt-mark hold flash-kernel flash-kernel-piboot
      when: "'flash-kernel' not in hold_list.stdout"

    - name: Deshabilitar hooks de flash-kernel
      file:
        path: "{{ item }}"
        mode: "0644"
      loop:
        - /etc/initramfs/post-update.d/flash-kernel
        - /etc/kernel/postinst.d/zz-flash-kernel
        - /etc/kernel/postrm.d/zz-flash-kernel
      ignore_errors: yes

    # ============================================================
    # PASO 2: Información previa
    # ============================================================
    - name: Obtener kernel actual
      command: uname -r
      register: kernel_before
      changed_when: false

    - name: Mostrar kernel actual
      debug:
        msg: "Kernel actual: {{ kernel_before.stdout }}"

    # ============================================================
    # PASO 3: Limpiar y actualizar cache de apt
    # ============================================================
    - name: Limpiar cache de apt (evita errores 404)
      file:
        path: /var/lib/apt/lists
        state: absent
      
    - name: Recrear directorio de listas
      file:
        path: /var/lib/apt/lists/partial
        state: directory
        mode: "0755"

    - name: Actualizar cache de apt
      apt:
        update_cache: yes

    # ============================================================
    # PASO 4: Actualizar paquetes
    # ============================================================
    - name: Listar paquetes actualizables
      command: apt list --upgradable
      register: upgradable
      changed_when: false

    - name: Mostrar paquetes actualizables
      debug:
        msg: "{{ upgradable.stdout_lines }}"

    - name: Actualizar todos los paquetes
      apt:
        upgrade: safe
        autoremove: yes
        autoclean: yes
      register: apt_result

    # ============================================================
    # PASO 5: Verificar si requiere reinicio
    # ============================================================
    - name: Verificar si se requiere reinicio
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Obtener kernel después de actualización
      command: uname -r
      register: kernel_after
      changed_when: false

    - name: Verificar si hay nuevo kernel instalado
      shell: ls -t /boot/vmlinuz-* 2>/dev/null | head -1 | sed 's/.*vmlinuz-//' || echo "none"
      register: latest_kernel
      changed_when: false

    # ============================================================
    # PASO 6: Reiniciar si se solicita
    # ============================================================
    - name: Reiniciar nodo
      reboot:
        msg: "Reiniciando por actualización de paquetes"
        reboot_timeout: 300
      when: reboot | bool and reboot_required.stat.exists

    - name: Esperar a que el nodo esté disponible
      wait_for_connection:
        delay: 10
        timeout: 300
      when: reboot | bool and reboot_required.stat.exists

    # ============================================================
    # PASO 7: Resumen
    # ============================================================
    - name: Resumen final
      debug:
        msg: |
          ============================================
          NODO: {{ inventory_hostname }}
          ============================================
          Kernel en ejecución: {{ kernel_after.stdout }}
          Kernel más reciente instalado: {{ latest_kernel.stdout }}
          Requiere reinicio: {{ 'Sí' if reboot_required.stat.exists else 'No' }}
          
          {% if latest_kernel.stdout != kernel_after.stdout %}
          ⚠️  HAY NUEVO KERNEL DISPONIBLE
          Para aplicarlo, ejecuta:
            ansible-playbook playbooks/update-kernel.yml --limit {{ inventory_hostname }}
          {% endif %}
          ============================================
