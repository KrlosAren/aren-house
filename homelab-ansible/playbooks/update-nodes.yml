---
# Playbook: update-nodes.yml
# Propósito: Actualizar paquetes en los nodos worker
#
# Uso:
#   ansible-playbook playbooks/update-nodes.yml                    # Todos los nodos
#   ansible-playbook playbooks/update-nodes.yml --limit rp2-node   # Solo rp2
#   ansible-playbook playbooks/update-nodes.yml -e "reboot=true"   # Con reinicio automático

- name: Actualizar nodos
  hosts: nodes
  become: yes
  serial: 1  # Un nodo a la vez para no bajar el cluster completo

  vars:
    reboot: false

  tasks:
    # ============================================================
    # PASO 1: Información previa
    # ============================================================
    - name: Obtener kernel actual
      command: uname -r
      register: kernel_before
      changed_when: false

    - name: Mostrar kernel actual
      debug:
        msg: "Kernel actual en {{ inventory_hostname }}: {{ kernel_before.stdout }}"

    # ============================================================
    # PASO 2: Actualizar paquetes
    # ============================================================
    - name: Actualizar cache de apt
      apt:
        update_cache: yes

    - name: Listar paquetes actualizables
      command: apt list --upgradable
      register: upgradable
      changed_when: false
      failed_when: false

    - name: Mostrar paquetes actualizables
      debug:
        msg: "{{ upgradable.stdout_lines }}"

    - name: Actualizar todos los paquetes
      apt:
        upgrade: safe
        autoremove: yes
        autoclean: yes

    # ============================================================
    # PASO 3: Verificar si requiere reinicio
    # ============================================================
    - name: Verificar si se requiere reinicio
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reiniciar nodo si se solicita y es necesario
      reboot:
        msg: "Reiniciando por actualización de paquetes"
        reboot_timeout: 300
      when: reboot | bool and reboot_required.stat.exists

    # ============================================================
    # PASO 4: Resumen
    # ============================================================
    - name: Obtener kernel después de actualización
      command: uname -r
      register: kernel_after
      changed_when: false

    - name: Resumen final
      debug:
        msg: |
          ============================================
          NODO: {{ inventory_hostname }}
          ============================================
          Kernel: {{ kernel_after.stdout }}
          Requiere reinicio: {{ 'Sí' if reboot_required.stat.exists else 'No' }}
          {% if reboot_required.stat.exists and not (reboot | bool) %}
          Para reiniciar:
            ansible-playbook playbooks/update-nodes.yml --limit {{ inventory_hostname }} -e "reboot=true"
          {% endif %}
          ============================================
