---
# Playbook: update-nodes.yml
# Propósito: Actualizar paquetes en los nodos
#
# Uso:
#   ansible-playbook playbooks/update-nodes.yml                    # Todos los nodos
#   ansible-playbook playbooks/update-nodes.yml --limit rp2        # Solo rp2
#   ansible-playbook playbooks/update-nodes.yml -e "reboot=true"   # Con reinicio
#
# Variables opcionales:
#   - reboot: true/false - Reiniciar después de actualizar (default: false)
#   - update_kernel: true/false - Actualizar kernel y TFTP (default: false)

- name: Actualizar nodos
  hosts: nodes
  become: yes
  serial: 1  # Actualiza un nodo a la vez para evitar problemas

  vars:
    reboot: false
    update_kernel: false

  tasks:
    # ============================================================
    # PASO 1: Información previa
    # ============================================================
    - name: Obtener información del sistema
      command: uname -r
      register: kernel_before
      changed_when: false

    - name: Mostrar kernel actual
      debug:
        msg: "Kernel actual: {{ kernel_before.stdout }}"

    # ============================================================
    # PASO 2: Actualizar paquetes
    # ============================================================
    - name: Actualizar cache de apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Listar paquetes actualizables
      command: apt list --upgradable
      register: upgradable
      changed_when: false

    - name: Mostrar paquetes actualizables
      debug:
        msg: "{{ upgradable.stdout_lines }}"

    - name: Actualizar todos los paquetes
      apt:
        upgrade: safe
        autoremove: yes
        autoclean: yes
      register: apt_result

    - name: Mostrar resultado de actualización
      debug:
        msg: "Paquetes actualizados: {{ apt_result.changed }}"

    # ============================================================
    # PASO 3: Verificar si requiere reinicio
    # ============================================================
    - name: Verificar si se requiere reinicio
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Mostrar si requiere reinicio
      debug:
        msg: "{{ 'REQUIERE REINICIO' if reboot_required.stat.exists else 'No requiere reinicio' }}"

    # ============================================================
    # PASO 4: Reiniciar si se solicita
    # ============================================================
    - name: Reiniciar nodo
      reboot:
        msg: "Reiniciando por actualización de paquetes"
        reboot_timeout: 300
      when: reboot | bool and reboot_required.stat.exists

    - name: Esperar a que el nodo esté disponible
      wait_for_connection:
        delay: 10
        timeout: 300
      when: reboot | bool and reboot_required.stat.exists

    # ============================================================
    # PASO 5: Información posterior
    # ============================================================
    - name: Obtener kernel después de actualización
      command: uname -r
      register: kernel_after
      changed_when: false

    - name: Resumen final
      debug:
        msg: |
          ============================================
          NODO: {{ inventory_hostname }}
          ============================================
          Kernel antes: {{ kernel_before.stdout }}
          Kernel ahora: {{ kernel_after.stdout }}
          Requiere reinicio: {{ 'Sí' if reboot_required.stat.exists else 'No' }}
          ============================================

# ============================================================
# ACTUALIZAR TFTP (solo si se actualizó kernel)
# ============================================================
- name: Actualizar archivos de boot en TFTP
  hosts: gateway
  become: yes
  
  vars:
    update_kernel: false

  tasks:
    - name: Aviso sobre actualización de kernel
      debug:
        msg: |
          ============================================
          IMPORTANTE: Si actualizaste el kernel en los nodos,
          debes actualizar los archivos de boot en TFTP:
          
          Para rp2:
            sudo rsync -av admin@10.0.0.2:/boot/firmware/ /srv/tftp/440dc91d/
          
          Para rp3:
            sudo rsync -av admin@10.0.0.3:/boot/firmware/ /srv/tftp/02671e08/
          
          Luego reinicia los nodos para usar el nuevo kernel.
          ============================================
      when: update_kernel | bool
