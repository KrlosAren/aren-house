---
# Playbook: install-basic-tools-nodes.yml
# Propósito: Instalar herramientas básicas en los nodos
#
# Uso:
#   ansible-playbook playbooks/install-basic-tools-nodes.yml                    # Todos los nodos
#   ansible-playbook playbooks/install-basic-tools-nodes.yml --limit rp2        # Solo rp2
#   ansible-playbook playbooks/install-basic-tools-nodes.yml -e "reboot=true"   # Con reinicio
#
# Variables opcionales:
#   - reboot: true/false - Reiniciar después de actualizar (default: false)
#   - update_kernel: true/false - Actualizar kernel y TFTP (default: false)
#
- name: Instalar herramientas básicas en nodos
  hosts: nodes
  become: yes
  serial: 1  # Instala una herramienta a la vez para evitar problemas

  vars:
    reboot: false

  tasks:
    # ============================================================
    # PASO 1: Información previa
    # ============================================================
    - name: Obtener información del sistema
      command: uname -r
      register: kernel_before
      changed_when: false

    - name: Mostrar kernel actual
      debug:
        msg: "Kernel actual: {{ kernel_before.stdout }}"

    # ============================================================
    # PASO 2: Intalar herramientas básicas
    # ============================================================
    - name: Actualizar lista de paquetes
      apt:
        update_cache: yes
      register: update_result
      changed_when: update_result.cache_updated
    
    - name: Instalar speedtest-cli
      apt:
        name: speedtest-cli
        state: present
      register: speedtest_result
    
    - name: Instalar htop
      apt:
        name: htop
        state: present
      register: htop_result
    
    - name: Instalar git
      apt:
        name: git
        state: present
      register: git_result