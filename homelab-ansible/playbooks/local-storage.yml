- name: Configurar storage local
  hosts: nodes
  become: yes

  vars:
    ssd_mount: /mnt/ssd

  tasks:
    # ========================================
    # Detectar disco por LABEL
    # ========================================
    - name: Detectar disco SSD (LABEL=ssd)
      shell: "blkid -t LABEL=ssd -o device || true"
      register: ssd_disk
      changed_when: false
      failed_when: false
      tags: detect

    - name: Mostrar disco detectado
      debug:
        msg: "SSD disk: {{ ssd_disk.stdout | default('No encontrado') }}"
      tags: detect

    - name: Fallar si no existe disco LABEL=ssd
      fail:
        msg: "No se encontró un disco/partición con LABEL=ssd. Usar: sudo e2label /dev/sda1 ssd"
      when: ssd_disk.stdout | trim == ""
      tags: detect

    # ========================================
    # Montar SSD
    # ========================================
    - name: Crear punto de montaje para SSD
      file:
        path: "{{ ssd_mount }}"
        state: directory
        mode: "0755"
      tags: mount

    - name: Obtener UUID del disco SSD
      shell: "blkid -s UUID -o value {{ ssd_disk.stdout }}"
      register: ssd_uuid
      changed_when: false
      tags: mount

    - name: Montar disco SSD en fstab
      mount:
        path: "{{ ssd_mount }}"
        src: "UUID={{ ssd_uuid.stdout }}"
        fstype: ext4
        opts: "defaults,nofail"
        state: mounted
      when: ssd_uuid.stdout | trim != ""
      tags: mount

    # ========================================
    # Configurar Docker para usar storage local
    # ========================================
    - name: Detener Docker
      systemd:
        name: docker
        state: stopped
      tags: docker

    - name: Crear directorio Docker en disco local
      file:
        path: "{{ ssd_mount }}/docker"
        state: directory
        mode: "0755"
      tags: docker

    - name: Verificar si /var/lib/docker es symlink
      stat:
        path: /var/lib/docker
      register: docker_lib_stat
      tags: docker

    - name: Mover datos Docker existentes (si no es symlink)
      command: mv /var/lib/docker /var/lib/docker.old
      when:
        - docker_lib_stat.stat.exists
        - not docker_lib_stat.stat.islnk
      failed_when: false
      tags: docker

    - name: Crear symlink para Docker
      file:
        src: "{{ ssd_mount }}/docker"
        dest: /var/lib/docker
        state: link
        force: yes
      tags: docker

    - name: Configurar overlay2 storage driver
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "storage-driver": "overlay2"
          }
        mode: "0644"
      tags: docker

    - name: Iniciar Docker
      systemd:
        name: docker
        state: started
      tags: docker

    # ========================================
    # Configurar k3s/rancher para usar storage local
    # ========================================
    - name: Crear directorio rancher en disco local
      file:
        path: "{{ ssd_mount }}/rancher"
        state: directory
        mode: "0755"
      tags: rancher

    - name: Verificar si /var/lib/rancher es symlink
      stat:
        path: /var/lib/rancher
      register: rancher_lib_stat
      tags: rancher

    - name: Mover datos rancher existentes (si no es symlink)
      command: mv /var/lib/rancher /var/lib/rancher.old
      when:
        - rancher_lib_stat.stat.exists
        - not rancher_lib_stat.stat.islnk
      failed_when: false
      tags: rancher

    - name: Crear symlink para rancher
      file:
        src: "{{ ssd_mount }}/rancher"
        dest: /var/lib/rancher
        state: link
        force: yes
      tags: rancher

    # ========================================
    # Verificar
    # ========================================
    - name: Verificar storage driver
      command: docker info --format '{{ "{{" }}.Driver{{ "}}" }}'
      register: driver_check
      changed_when: false
      tags: verify

    - name: Verificar montaje
      command: df -h {{ ssd_mount }}
      register: mount_check
      changed_when: false
      failed_when: false
      tags: verify

    - name: Verificar symlinks
      shell: "ls -la /var/lib/docker /var/lib/rancher"
      register: symlink_check
      changed_when: false
      failed_when: false
      tags: verify

    - name: Mostrar resultado
      debug:
        msg:
          - "Storage driver: {{ driver_check.stdout }}"
          - "{{ mount_check.stdout_lines }}"
          - "{{ symlink_check.stdout_lines }}"
      tags: verify
