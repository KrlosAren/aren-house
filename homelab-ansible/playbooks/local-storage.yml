- name: Configurar storage local
  hosts: nodes
  become: yes

  vars:
    docker_mount: /mnt/docker
    storage_mount: /mnt/storage

  tasks:
    # ========================================
    # Detectar discos por LABEL
    # ========================================
    - name: Detectar disco para Docker (LABEL=docker)
      shell: "blkid -t LABEL=docker -o device || true"
      register: docker_disk
      changed_when: false
      failed_when: false
      tags: detect

    - name: Detectar disco para Storage (LABEL=storage)
      shell: "blkid -t LABEL=storage -o device || true"
      register: storage_disk
      changed_when: false
      failed_when: false
      tags: detect

    - name: Definir si se debe montar storage separado
      set_fact:
        do_storage_mount: >-
          {{ (storage_disk.stdout | trim) != ''
             and (docker_disk.stdout | trim) != ''
             and (storage_disk.stdout | trim) != (docker_disk.stdout | trim) }}
      tags: detect

    - name: Mostrar discos detectados
      debug:
        msg:
          - "Docker disk: {{ docker_disk.stdout | default('No encontrado') }}"
          - "Storage disk: {{ storage_disk.stdout | default('No encontrado') }}"
          - "Montar storage separado: {{ do_storage_mount }}"
      tags: detect

    - name: Fallar si no existe disco LABEL=docker
      fail:
        msg: "No se encontró un disco/partición con LABEL=docker. (rp2: e2label /dev/mmcblk0p2 docker)"
      when: docker_disk.stdout | trim == ""
      tags: detect

    # ========================================
    # Montar Docker
    # ========================================
    - name: Crear punto de montaje para Docker
      file:
        path: "{{ docker_mount }}"
        state: directory
        mode: '0755'
      tags: docker

    - name: Obtener UUID del disco Docker
      shell: "blkid -s UUID -o value {{ docker_disk.stdout }}"
      register: docker_uuid
      changed_when: false
      tags: docker

    - name: Montar disco Docker en fstab
      mount:
        path: "{{ docker_mount }}"
        src: "UUID={{ docker_uuid.stdout }}"
        fstype: ext4
        opts: "defaults,nofail"
        state: mounted
      when: docker_uuid.stdout | trim != ""
      tags: docker

    # ========================================
    # Montar Storage (solo si existe y es distinto)
    # ========================================
    - name: Crear punto de montaje para Storage
      file:
        path: "{{ storage_mount }}"
        state: directory
        mode: '0755'
      when: do_storage_mount
      tags: storage

    - name: Obtener UUID del disco Storage
      shell: "blkid -s UUID -o value {{ storage_disk.stdout }}"
      register: storage_uuid
      changed_when: false
      when: do_storage_mount
      tags: storage

    - name: Montar disco Storage en fstab
      mount:
        path: "{{ storage_mount }}"
        src: "UUID={{ storage_uuid.stdout }}"
        fstype: ext4
        opts: "defaults,nofail"
        state: mounted
      when: do_storage_mount and (storage_uuid.stdout | trim) != ""
      tags: storage

    # ========================================
    # Configurar Docker para usar storage local
    # ========================================
    - name: Detener Docker
      systemd:
        name: docker
        state: stopped
      tags: docker

    - name: Crear directorio Docker en disco local
      file:
        path: "{{ docker_mount }}/docker"
        state: directory
        mode: '0755'
      tags: docker

    - name: Verificar si /var/lib/docker es symlink
      stat:
        path: /var/lib/docker
      register: docker_lib_stat
      tags: docker

    - name: Mover datos Docker existentes (si no es symlink)
      command: mv /var/lib/docker /var/lib/docker.old
      when:
        - docker_lib_stat.stat.exists
        - not docker_lib_stat.stat.islnk
      failed_when: false
      tags: docker

    - name: Crear symlink para Docker
      file:
        src: "{{ docker_mount }}/docker"
        dest: /var/lib/docker
        state: link
        force: yes
      tags: docker

    - name: Configurar overlay2 storage driver
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "storage-driver": "overlay2"
          }
        mode: '0644'
      tags: docker

    - name: Iniciar Docker
      systemd:
        name: docker
        state: started
      tags: docker

    # ========================================
    # Verificar
    # ========================================
    - name: Verificar storage driver
      command: docker info --format '{{ "{{" }}.Driver{{ "}}" }}'
      register: driver_check
      changed_when: false
      tags: verify

    - name: Verificar montajes
      command: df -h {{ docker_mount }} {{ storage_mount }}
      register: mount_check
      changed_when: false
      failed_when: false
      tags: verify

    - name: Mostrar resultado
      debug:
        msg:
          - "Storage driver: {{ driver_check.stdout }}"
          - "{{ mount_check.stdout_lines }}"
      tags: verify
