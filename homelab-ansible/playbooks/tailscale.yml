# Playbook: tailscale.yml
# Propósito: Instalar y configurar Tailscale en el gateway
#
# Uso:
#   ansible-playbook playbooks/tailscale.yml
#
# Nota: Después de ejecutar, debes autenticar manualmente con:
#   sudo tailscale up --advertise-routes=10.0.0.0/24
#
- name: Instalar Tailscale
  hosts: gateway
  become: yes

  vars:
    tailscale_advertise_routes:
      - 10.0.0.0/24        # LAN del cluster: nodos, MetalLB (10.0.0.50-60)
    tailscale_serve:
      - name: go2rtc            # cámara Tapo C110 → https://rp1-master.<tailnet>.ts.net:8443
        port: 8443
        target: http://10.43.92.177:1984   # Service go2rtc (ns cameras), clusterIP fija
      - name: ntfy              # notificaciones push → https://rp1-master.<tailnet>.ts.net:8444
        port: 8444
        target: http://10.43.200.10:80     # Service ntfy (ns ntfy), clusterIP fija
      - name: frigate           # NVR + detección IA → https://rp1-master.<tailnet>.ts.net:8445
        port: 8445
        target: http://10.43.200.11:5000   # Service frigate (ns cameras), clusterIP fija
      - name: prometheus
        port: 8446
        target: http://10.43.200.12:9090   # Service prometheus (ns monitoring)
      - name: grafana           # tiene login propio
        port: 8447
        target: http://10.43.200.13:3000   # Service grafana (ns monitoring)
      - name: alertmanager
        port: 8448
        target: http://10.43.200.14:9093   # Service alertmanager (ns monitoring)

  tasks:
    - name: Instalar Tailscale via script oficial
      shell: curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale
      tags: install

    - name: Habilitar IP forwarding IPv4
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: yes
        state: present
        reload: yes
      tags: config

    - name: Habilitar IP forwarding IPv6
      sysctl:
        name: net.ipv6.conf.all.forwarding
        value: '1'
        sysctl_set: yes
        state: present
        reload: yes
      tags: config

    # --- Subnet router: expone la LAN 10.0.0.0/24 al tailnet ---
    # Tras anunciarla, APROBAR en login.tailscale.com/admin/machines → rp1-master → Edit route settings.
    # `tailscale set` (no `up`): cambia solo esta opción sin resetear el resto de flags.
    - name: Leer rutas anunciadas actualmente
      command: tailscale debug prefs
      register: ts_prefs
      changed_when: false
      check_mode: false   # solo lectura: corre también en --check
      tags: routes

    - name: Anunciar subnet routes
      command: "tailscale set --advertise-routes={{ tailscale_advertise_routes | join(',') }}"
      when: (ts_prefs.stdout | from_json).AdvertiseRoutes | default([], true) | sort != tailscale_advertise_routes | sort
      tags: routes

    # --- tailscale serve: publica servicios k8s SOLO dentro del tailnet (ADR-017) ---
    # Requiere "HTTPS Certificates" habilitado en login.tailscale.com/admin/dns
    # El destino es una clusterIP fija (rp1 no resuelve DNS del cluster).
    - name: Leer configuración actual de tailscale serve
      command: tailscale serve status --json
      register: ts_serve
      changed_when: false
      failed_when: false
      check_mode: false   # solo lectura: corre también en --check
      tags: serve

    - name: Publicar servicios via tailscale serve
      command: "tailscale serve --bg --https={{ item.port }} {{ item.target }}"
      loop: "{{ tailscale_serve }}"
      when: (':' ~ item.port) not in ts_serve.stdout
      tags: serve

    - name: Verificar estado de Tailscale
      command: tailscale status
      register: tailscale_status
      changed_when: false
      ignore_errors: yes
      tags: verify

    - name: Mostrar estado de Tailscale
      debug:
        msg: "{{ tailscale_status.stdout_lines }}"
      tags: verify
