# Playbook: gateway.yml
# Propósito: Configurar el gateway completo (rp1-master) con todos los servicios
#
# Servicios configurados:
#   - WireGuard VPN (acceso remoto)
#   - dnsmasq (DHCP, DNS, TFTP)
#   - NFS (sistemas de archivos para netboot)
#
# Uso:
#   ansible-playbook playbooks/gateway.yml
#   ansible-playbook playbooks/gateway.yml --check    # Dry-run
#   ansible-playbook playbooks/gateway.yml --tags wireguard  # Solo WireGuard
---
- name: Configure Gateway
  hosts: gateway
  become: yes

  vars:
    # WireGuard perrs
    wireguard_peers:
      - name: mac-aren
        public_key: "yhk7pujehS6ZxKSPNWdWveGweO6/uVj6Z0p81H8nnkg="
        allowed_ips: "10.0.1.2/32"
    
    # PXE boot hosts
    dnsmasq_hosts:
      - name: rp2
        mac: "2c:cf:67:88:9e:f5"
        ip: "10.0.0.2"

      - name: rp3
        mac: "2c:cf:67:a9:b9:13"
        ip: "10.0.0.3"

      - name: switch
        mac: "ec:75:0c:ff:fc:d6"
        ip: "10.0.0.5"
    
    # NFS nodes (netboot)
    nfs_nodes:
      - name: rp2
        ip: "10.0.0.2"
      - name: rp3
        ip: "10.0.0.3"

  roles:
    - wireguard
    - dnsmasq
    - nfs
