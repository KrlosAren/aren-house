# Playbook : firewall.yml
# Proposito: configurar firewall (ufw) en el gateway y nodos
#
# Uso:
#   ansible-playbook playbooks/firewall.yml                     # todos
#   ansible-playbook playbooks/firewall.yml --limit gateway     # solo gateway
#   ansible-playbook playbooks/firewall.yml --limit nodes       # solo nodos
#
# IMPORTANTE: Las reglas de allow se crean ANTES de las políticas deny
# para evitar bloquear la conexión SSH durante la ejecución.
#
- name: configurar firewall en gateway
  hosts: gateway
  become: yes

  vars:
    lan_network: "10.0.0.0/24"
    wan_network: "192.168.1.0/24"
    tailscale_network: "100.64.0.0/10"
    wan_interface: "enx00e04c683da2"
    lan_interface: "eth0"
    gateway_ip: "10.0.0.1"
    k3s_pod_cidr: "10.42.0.0/16"
    k3s_service_cidr: "10.43.0.0/16"

  tasks:
    # ========================================
    # instalacion
    # ========================================
    - name: instalar ufw
      apt:
        name: ufw
        state: present
      tags: install

    # ======================================
    # RESETEAR UFW (evita bloqueos si ya estaba habilitado)
    # ======================================
    - name: verificar si ufw existe antes de resetear
      command: which ufw
      register: ufw_exists
      failed_when: false
      changed_when: false
      tags: reset

    - name: resetear ufw para evitar bloqueos
      command: ufw --force reset
      changed_when: true
      when: ufw_exists.rc == 0
      tags: reset

    # ======================================
    # PRIMERO: reglas de allow
    # ======================================

    # reglas LAN - permitir todo
    - name: permitir todo desde LAN
      ufw:
        rule: allow
        interface: "{{ lan_interface }}"
        direction: in
        from_ip: "{{ lan_network }}"
        comment: "Todo desde LAN"
      tags: lan

    # reglas DHCP broadcast
    - name: permitir DHCP broadcast en LAN
      ufw:
        rule: allow
        interface: "{{ lan_interface }}"
        direction: in
        port: "67:68"
        proto: udp
        comment: "DHCP broadcast en LAN"
      tags: dhcp

    # reglas SSH
    - name: permitir SSH desde Tailscale
      ufw:
        rule: allow
        port: "22"
        proto: tcp
        from_ip: "{{ tailscale_network }}"
        comment: "SSH desde Tailscale"
      tags: ssh

    - name: limitar SSH desde WAN (rate limit)
      ufw:
        rule: limit
        port: "22"
        proto: tcp
        comment: "SSH desde WAN con rate limit"
      tags: ssh

    # reglas Tailscale
    - name: permitir todo desde Tailscale
      ufw:
        rule: allow
        from_ip: "{{ tailscale_network }}"
        comment: "Todo desde Tailscale VPN"
      tags: tailscale

    # reglas DNS
    - name: permitir DNS desde WAN
      ufw:
        rule: allow
        port: "53"
        from_ip: "{{ wan_network }}"
        comment: "DNS desde WAN (resolver k8s.homelab.local)"
      tags: dns

    # reglas http/https
    - name: permitir HTTP desde cualquier lugar
      ufw:
        rule: allow
        port: "80"
        proto: tcp
        comment: "HTTP"
      tags: web

    - name: permitir HTTPS desde cualquier lugar
      ufw:
        rule: allow
        port: "443"
        proto: tcp
        comment: "HTTPS"
      tags: web

    # reglas k3s
    - name: permitir todo desde Pods k3s
      ufw:
        rule: allow
        from_ip: "{{ k3s_pod_cidr }}"
        comment: "Todo desde Pods k3s"
      tags: k3s

    - name: permitir k3s API desde Tailscale
      ufw:
        rule: allow
        port: "6443"
        proto: tcp
        from_ip: "{{ tailscale_network }}"
        comment: "k3s API desde Tailscale"
      tags: k3s

    - name: permitir k3s API desde WAN
      ufw:
        rule: allow
        port: "6443"
        proto: tcp
        from_ip: "{{ wan_network }}"
        comment: "k3s API desde WAN"
      tags: k3s

    - name: permitir todo desde services k3s
      ufw:
        rule: allow
        from_ip: "{{ k3s_service_cidr }}"
        comment: "Todo desde services CIDR k3s"
      tags: k3s

    # =======================================
    # SEGUNDO: Politicas por defecto
    # =======================================
    - name: configurar politica por defecto - denegar entrada
      ufw:
        direction: incoming
        policy: deny
      tags: policy

    - name: configurar politica por defecto - permitir salida
      ufw:
        direction: outgoing
        policy: allow
      tags: policy

    # ===================================================
    # forwarding (necesario para NAT)
    # ===================================================
    - name: habilitar ip_forward en el kernel
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        sysctl_file: /etc/sysctl.d/99-forwarding.conf
        reload: yes
      tags: forward

    - name: habilitar forwarding en ufw
      lineinfile:
        path: /etc/default/ufw
        regexp: "^DEFAULT_FORWARD_POLICY="
        line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
      tags: forward
      notify: Reload ufw

    # ===================================================
    # NAT: MASQUERADE + DNAT en /etc/ufw/before.rules
    # ===================================================
    - name: NAT - agregar reglas MASQUERADE y DNAT en before.rules
      blockinfile:
        path: /etc/ufw/before.rules
        insertbefore: "^\\*filter"
        marker: "# {mark} NAT RULES HOMELAB"
        block: |
          *nat
          :PREROUTING ACCEPT [0:0]
          :POSTROUTING ACCEPT [0:0]
          # MASQUERADE - LAN sale a internet via WAN
          -A POSTROUTING -s {{ lan_network }} -o {{ wan_interface }} -j MASQUERADE
          # DNAT - WAN HTTP/HTTPS -> MetalLB (Traefik k3s)
          -A PREROUTING -i {{ wan_interface }} -p tcp --dport 80 -j DNAT --to-destination 10.0.0.50:80
          -A PREROUTING -i {{ wan_interface }} -p tcp --dport 443 -j DNAT --to-destination 10.0.0.50:443
          COMMIT
      notify: Reload ufw
      tags: nat

    # ===================================================
    # TERCERO: habilitar firewall
    # ===================================================
    - name: habilitar ufw
      ufw:
        state: enabled
      tags: enable

    # ===================================================
    # resumen
    # ===================================================
    - name: obtener estado del firewall
      command: ufw status verbose
      register: ufw_status
      changed_when: false
      tags: always

    - name: mostrar estado del firewall
      debug:
        msg: "{{ ufw_status.stdout_lines }}"
      tags: always

  handlers:
    - name: Reload ufw
      ufw:
        state: reloaded

# =================================================
# Firewall para nodos
# =================================================
- name: configurar firewall para nodos
  hosts: nodes
  become: yes

  vars:
    lan_network: "10.0.0.0/24"
    tailscale_network: "100.64.0.0/10"
    gateway_ip: "10.0.0.1"
    k3s_pod_cidr: "10.42.0.0/16"
    k3s_service_cidr: "10.43.0.0/16"

  tasks:
    - name: instalar ufw
      apt:
        name: ufw
        state: present
      tags: install

    # ======================================
    # RESETEAR UFW (evita bloqueos si ya estaba habilitado)
    # ======================================
    - name: resetear ufw para evitar bloqueos
      command: ufw --force reset
      changed_when: true
      tags: reset

    - name: resetear y configurar ufw atómicamente
      shell: |
        ufw --force disable
        ufw --force reset
        ufw allow from {{ lan_network }} to any port 22 proto tcp comment "SSH LAN"
        ufw allow from {{ tailscale_network }} to any port 22 proto tcp comment "SSH Tailscale"
        ufw allow from {{ gateway_ip }} comment "Todo desde gateway"
        ufw allow from {{ lan_network }} comment "LAN nodos k3s"
        ufw allow from {{ k3s_pod_cidr }} comment "k3s pods CIDR"
        ufw allow from {{ k3s_service_cidr }} comment "k3s services CIDR"
        ufw allow from {{ tailscale_network }} comment "Todo desde Tailscale"
        ufw default deny incoming
        ufw default allow outgoing
        ufw --force enable
      async: 30
      poll: 5
      changed_when: true
      tags: firewall

    # ===================================================
    # default gateway via rp1 (NAT)
    # ===================================================
    - name: verificar default gateway actual
      command: ip route show default
      register: current_gateway
      changed_when: false
      tags: gateway

    - name: agregar default gateway si no apunta a 10.0.0.1
      command: ip route replace default via {{ gateway_ip }}
      when: "'10.0.0.1' not in current_gateway.stdout"
      tags: gateway

    - name: crear servicio systemd para persistir default gateway
      copy:
        content: |
          [Unit]
          Description=Set default gateway via rp1-master (NAT)
          After=network.target
          Wants=network.target

          [Service]
          Type=oneshot
          ExecStart=/sbin/ip route replace default via {{ gateway_ip }}
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/set-default-gateway.service
        mode: '0644'
      notify: recargar systemd y habilitar gateway
      tags: gateway

    - name: obtener estado del firewall
      command: ufw status verbose
      register: ufw_status
      changed_when: false
      tags: always

    - name: mostrar estado del firewall
      debug:
        msg: "{{ ufw_status.stdout_lines }}"
      tags: always

  handlers:
    - name: recargar systemd y habilitar gateway
      systemd:
        name: set-default-gateway
        daemon_reload: yes
        enabled: yes
        state: started
