# Playbook : firewall.yml
# Proposito: configurar firewall (ufw) en el gateway y nodos
#
# Uso:
#   ansible-playbook playbooks/firewall.yml                     # todos
#   ansible-playbook playbooks/firewall.yml --limit gateway     # solo gateway
#   ansible-playbook playbooks/firewall.yml --limit nodes       # solo nodos
#
# IMPORTANTE: Las reglas de allow se crean ANTES de las políticas deny
# para evitar bloquear la conexión SSH durante la ejecución.
#
- name: configurar firewall en gateway
  hosts: gateway
  become: yes

  vars:
    lan_network: "10.0.0.0/24"
    vpn_network: "10.0.1.0/24"
    wan_interface: "enx00e04c683da2"
    lan_interface: "eth0"
    gateway_ip: "10.0.0.1"
    k3s_pod_cidr: "10.42.0.0/16"
    k3s_service_cidr: "10.43.0.0/16"

  tasks:
    # ========================================
    # instalacion
    # ========================================
    - name: instalar ufw
      apt:
        name: ufw
        state: present
      tags: install

    # ======================================
    # RESETEAR UFW (evita bloqueos si ya estaba habilitado)
    # ======================================
    - name: resetear ufw para evitar bloqueos
      command: ufw --force reset
      changed_when: true
      tags: reset

    # ======================================
    # PRIMERO: reglas de allow
    # ======================================

    # reglas LAN - permitir todo (netboot)
    - name: permitir todo desde LAN (necesario para NFS netboot)
      ufw:
        rule: allow
        interface: "{{ lan_interface }}"
        direction: in
        from_ip: "{{ lan_network }}"
        comment: "Todo desde LAN (netboot)"
      tags: lan

    # reglas DHCP/TFTP broadcast
    - name: permitir DHCP broadcast en LAN
      ufw:
        rule: allow
        interface: "{{ lan_interface }}"
        direction: in
        port: "67:68"
        proto: udp
        comment: "DHCP broadcast en LAN"
      tags: dhcp

    - name: permitir TFTP en LAN
      ufw:
        rule: allow
        interface: "{{ lan_interface }}"
        direction: in
        port: "69"
        proto: udp
        comment: "TFTP en LAN"
      tags: tftp

    # reglas SSH
    - name: permitir SSH desde VPN
      ufw:
        rule: allow
        port: "22"
        proto: tcp
        from_ip: "{{ vpn_network }}"
        comment: "SSH desde VPN"
      tags: ssh

    - name: limitar SSH desde WAN (rate limit)
      ufw:
        rule: limit
        port: "22"
        proto: tcp
        comment: "SSH desde WAN con rate limit"
      tags: ssh

    # reglas wireguard
    - name: permitir WireGuard desde cualquier lugar
      ufw:
        rule: allow
        port: "51820"
        proto: udp
        comment: "WireGuard VPN"
      tags: wireguard

    # reglas VPN - servicios internos
    - name: permitir DNS desde VPN
      ufw:
        rule: allow
        port: "53"
        from_ip: "{{ vpn_network }}"
        comment: "DNS desde VPN"
      tags: dns

    - name: permitir NFS desde VPN
      ufw:
        rule: allow
        port: "2049"
        proto: tcp
        from_ip: "{{ vpn_network }}"
        comment: "NFS desde VPN"
      tags: nfs

    - name: permitir RPC portmapper desde VPN
      ufw:
        rule: allow
        port: "111"
        proto: tcp
        from_ip: "{{ vpn_network }}"
        comment: "RPC portmapper desde VPN"
      tags: nfs

    # reglas http/https (para servicios web futuros)
    - name: permitir HTTP desde cualquier lugar
      ufw:
        rule: allow
        port: "80"
        proto: tcp
        comment: "HTTP"
      tags: web

    - name: permitir HTTPS desde cualquier lugar
      ufw:
        rule: allow
        port: "443"
        proto: tcp
        comment: "HTTPS"
      tags: web

    - name: permitir todo desde Pods k3s
      ufw:
        rule: allow
        from_ip: "{{ k3s_pod_cidr }}"
        comment: "Todo desde Pods k3s"
      tags: k3s
    
    - name: permitir k3s API desde VPN
      ufw:
        rule: allow
        port: "6443"
        proto: tcp
        from_ip: "{{ vpn_network }}"
        comment: "k3s API desde VPN"
      tags: k3s


    - name: permitir todo desde services k3s
      ufw:
        rule: allow
        from_ip: "{{ k3s_service_cidr }}"
        comment: "Todo desde services CIDR k3s"
      tags: k3s

    # =======================================
    # SEGUNDO: Politicas por defecto
    # =======================================
    - name: configurar politica por defecto - denegar entrada
      ufw:
        direction: incoming
        policy: deny
      tags: policy

    - name: configurar politica por defecto - permitir salida
      ufw:
        direction: outgoing
        policy: allow
      tags: policy

    # ===================================================
    # forwarding (necesario para NAT)
    # ===================================================
    - name: habilitar forwarding en ufw
      lineinfile:
        path: /etc/default/ufw
        regexp: "^DEFAULT_FORWARD_POLICY="
        line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
      tags: forward
      notify: Reload ufw

    # ===================================================
    # TERCERO: habilitar firewall
    # ===================================================
    - name: habilitar ufw
      ufw:
        state: enabled
      tags: enable

    # ===================================================
    # resumen
    # ===================================================
    - name: obtener estado del firewall
      command: ufw status verbose
      register: ufw_status
      changed_when: false
      tags: always

    - name: mostrar estado del firewall
      debug:
        msg: "{{ ufw_status.stdout_lines }}"
      tags: always

  handlers:
    - name: Reload ufw
      ufw:
        state: reloaded

# =================================================
# Firewall para nodos
# =================================================
- name: configurar firewall para nodos
  hosts: nodes
  become: yes

  vars:
    lan_network: "10.0.0.0/24"
    vpn_network: "10.0.1.0/24"
    gateway_ip: "10.0.0.1"
    k3s_pod_cidr: "10.42.0.0/16"
    k3s_service_cidr: "10.43.0.0/16"

  tasks:
    - name: instalar ufw
      apt:
        name: ufw
        state: present
      tags: install

    # ======================================
    # RESETEAR UFW (evita bloqueos si ya estaba habilitado)
    # ======================================
    - name: resetear ufw para evitar bloqueos
      command: ufw --force reset
      changed_when: true
      tags: reset

    - name: resetear y configurar ufw atómicamente
      shell: |
        ufw --force disable
        ufw --force reset
        ufw allow from {{ lan_network }} to any port 22 proto tcp comment "SSH LAN"
        ufw allow from {{ vpn_network }} to any port 22 proto tcp comment "SSH VPN"
        ufw allow from {{ gateway_ip }} comment "Todo desde gateway"
        ufw allow from {{ lan_network }} comment "LAN nodos k3s"
        ufw allow from {{ k3s_pod_cidr }} comment "k3s pods CIDR"
        ufw allow from {{ k3s_service_cidr }} comment "k3s services CIDR"
        ufw default deny incoming
        ufw default allow outgoing
        ufw --force enable
      async: 30
      poll: 5
      changed_when: true
      tags: firewall

    - name: obtener estado del firewall
      command: ufw status verbose
      register: ufw_status
      changed_when: false
      tags: always

    - name: mostrar estado del firewall
      debug:
        msg: "{{ ufw_status.stdout_lines }}"
      tags: always
