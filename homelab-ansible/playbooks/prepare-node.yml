---
# Playbook: prepare-node.yml
# Propósito: Preparar un nodo nuevo para netboot
#
# Requisitos previos:
#   1. Ubuntu instalado en microSD
#   2. ssh-copy-id ejecutado (acceso SSH sin contraseña)
#   3. Nodo agregado al inventory
#
# Uso:
#   ansible-playbook playbooks/prepare-node.yml --limit rp4-node

- name: Preparar nodo para netboot
  hosts: nodes
  become: yes

  tasks:
    # ============================================================
    # PASO 1: Verificar información del nodo
    # ============================================================
    - name: Obtener serial del procesador
      command: grep Serial /proc/cpuinfo
      register: cpu_serial
      changed_when: false

    - name: Mostrar serial del nodo
      debug:
        msg: "Serial completo: {{ cpu_serial.stdout }}. Usa los últimos 8 caracteres para TFTP."

    - name: Obtener MAC de eth0
      command: cat /sys/class/net/eth0/address
      register: eth0_mac
      changed_when: false

    - name: Mostrar MAC del nodo
      debug:
        msg: "MAC de eth0: {{ eth0_mac.stdout }}"

    # ============================================================
    # PASO 2: Configurar sudo sin contraseña
    # ============================================================
    - name: Configurar sudo sin contraseña para admin
      copy:
        content: "admin ALL=(ALL) NOPASSWD: ALL"
        dest: /etc/sudoers.d/admin
        mode: "0440"
        validate: 'visudo -cf %s'

    - name: Configurar sudo sin contraseña para usuario actual
      copy:
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD: ALL"
        dest: "/etc/sudoers.d/{{ ansible_user }}"
        mode: "0440"
        validate: 'visudo -cf %s'
      when: ansible_user != 'admin'

    # ============================================================
    # PASO 3: Configurar red eth0
    # ============================================================
    - name: Verificar si eth0 está configurado en netplan
      shell: grep -r "eth0" /etc/netplan/ || true
      register: eth0_configured
      changed_when: false

    - name: Crear configuración netplan para eth0
      copy:
        content: |
          network:
            version: 2
            ethernets:
              eth0:
                dhcp4: true
        dest: /etc/netplan/60-eth0.yaml
        mode: "0600"
      when: eth0_configured.stdout == ""
      notify: Apply netplan

    # ============================================================
    # PASO 4: Sincronizar tiempo
    # ============================================================
    - name: Forzar sincronización de tiempo con chrony
      command: chronyc makestep
      ignore_errors: yes
      changed_when: false

    # ============================================================
    # PASO 5: Deshabilitar paquetes incompatibles con NFS boot
    # ============================================================
    - name: Deshabilitar hooks de flash-kernel
      file:
        path: "{{ item }}"
        mode: "0644"
      loop:
        - /etc/initramfs/post-update.d/flash-kernel
        - /etc/kernel/postinst.d/zz-flash-kernel
        - /etc/kernel/postrm.d/zz-flash-kernel
      ignore_errors: yes

    - name: Marcar flash-kernel como hold
      command: apt-mark hold flash-kernel flash-kernel-piboot
      register: hold_result
      changed_when: "'already' not in hold_result.stdout"

    - name: Eliminar snapd (no funciona en NFS)
      apt:
        name: snapd
        state: absent
        purge: yes
      ignore_errors: yes

    # ============================================================
    # PASO 6: Configurar EEPROM para netboot
    # ============================================================
    - name: Crear archivo de configuración EEPROM
      copy:
        content: |
          BOOT_ORDER=0xf2461
          TFTP_PREFIX=2
          NET_INSTALL_AT_POWER_ON=0
        dest: /tmp/boot.conf
        mode: "0644"

    - name: Aplicar configuración EEPROM
      command: rpi-eeprom-config --apply /tmp/boot.conf
      register: eeprom_result

    - name: Verificar configuración EEPROM
      command: rpi-eeprom-config
      register: eeprom_verify
      changed_when: false

    - name: Mostrar configuración EEPROM
      debug:
        msg: "{{ eeprom_verify.stdout_lines }}"

    # ============================================================
    # PASO 7: Resumen final
    # ============================================================
    - name: Mostrar resumen
      debug:
        msg: |
          ============================================
          NODO PREPARADO PARA NETBOOT
          ============================================
          Hostname: {{ inventory_hostname }}
          IP: {{ ansible_host }}
          MAC: {{ eth0_mac.stdout }}
          Serial: {{ cpu_serial.stdout }}
          
          PRÓXIMOS PASOS MANUALES:
          1. Ejecutar playbook de servidor:
             ansible-playbook playbooks/setup-netboot-server.yml -e "node_name=NOMBRE node_serial=SERIAL node_mac={{ eth0_mac.stdout }}"
          
          2. Copiar filesystem a NFS (desde rp1-master):
             sudo rsync -axv admin@{{ ansible_host }}:/ /srv/nfs/NOMBRE/ --exclude=/proc/* --exclude=/sys/* --exclude=/dev/* --exclude=/tmp/* --exclude=/run/* --exclude=/mnt/* --exclude=/boot/firmware/*
          
          3. Copiar archivos de boot a TFTP:
             sudo rsync -av admin@{{ ansible_host }}:/boot/firmware/ /srv/tftp/SERIAL/
          
          4. Copiar /etc/shadow al NFS
          
          5. Apagar, quitar microSD y probar netboot
          ============================================

  handlers:
    - name: Apply netplan
      command: netplan apply
