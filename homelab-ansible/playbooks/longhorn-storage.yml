---
# Playbook: longhorn-storage.yml
# Propósito: Configurar almacenamiento para Longhorn en el cluster k3s
#
# Uso:
#   ansible-playbook playbooks/longhorn-storage.yml
- name: Configurar almacenamiento para Longhorn en el cluster k3s
  hosts: all
  become: true

  tasks:
    - name: Crear directorio para Longhorn
      file:
        path: /var/lib/longhorn
        state: directory
        owner: root
        group: root
        mode: '0755'
      tags: storage
