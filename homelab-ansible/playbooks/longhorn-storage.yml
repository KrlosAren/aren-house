---
# Playbook: longhorn-storage.yml
# Propósito: Configurar almacenamiento para Longhorn en el cluster k3s
#
# Uso:
#   ansible-playbook playbooks/longhorn-storage.yml
#   ansible-playbook playbooks/longhorn-storage.yml --limit rp1-master
#   ansible-playbook playbooks/longhorn-storage.yml --limit rp3-node
- name: Configurar almacenamiento para Longhorn en el cluster k3s
  hosts: all
  become: true

  tasks:
    - name: Crear directorio para Longhorn en rp1
      file: 
        path: /backup/longhorn
        owner: root
        group : root
        mode: '0755'
      when: inventory_hostname == 'rp1-master'
      tags: storage
    
    - name: Crear directorio para Longhorn en rp3
      file:
        path: "{{ item }}"
        state: directory
        owner: root 
        group: root 
        mode: '0755'
      loop:
        - /mnt/storage/longhorn
        - /mnt/storage/local-path
      when: inventory_hostname == 'rp3-node'
      tags: storage