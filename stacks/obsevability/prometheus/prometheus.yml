global:
  scrape_interval: 15s 
  evaluation_interval: 15s 

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: 
          - 'node_exporter:9100'    # Local (rp2)
          - '10.0.0.1:9100'         # Gateway (rp1)
          - '10.0.0.3:9100'         # Node (rp3)
