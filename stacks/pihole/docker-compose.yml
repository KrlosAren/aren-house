services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "8053:53/tcp"
      - "8053:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: 'America/Santiago'
      WEBPASSWORD: 'admin'
      DNSMASQ_LISTENING: 'all'
      FTLCONF_webserver_domain: "pihole.homelab.local"
    volumes:
      - pihole_etc_data:/etc/pihole
      - pihole_dnsmasq_data:/etc/dnsmasq.d
    networks:
      - router
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`pihole.homelab.local`)"
      - "traefik.http.routers.pihole.entrypoints=web"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"

volumes:
  pihole_etc_data:
  pihole_dnsmasq_data:

networks:
  router:
    external: true
