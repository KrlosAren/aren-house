services:
  
  n8n:
    image: n8nio/n8n:1.121.0
    container_name: n8n-main
    environment:
      - GENERIC_TIMEZONE="America/Santiago"
      - TZ="America/Santiago"
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      
      - N8N_RUNNERS_MODE=external
      - N8N_HOST=n8n.homelab.local
      - N8N_PROTOCOL=http
      - N8N_PORT=5678
      - WEBHOOK_URL=http://n8n.homelab.local/
      - N8N_EDITOR_BASE_URL=http://n8n.homelab.local/
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=secrets
      - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_SECURE_COOKIE=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=admin
      - DB_POSTGRESDB_PASSWORD=admin
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - router
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.homelab.local`)"
      - "traefik.http.routers.n8n.entrypoints=web"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.http.middlewares.n8n-headers.headers.customrequestheaders.X-Forwarded-Proto=http"
      - "traefik.http.routers.n8n.middlewares=n8n-headers"

  postgres:
    image: postgres:18.1
    restart: always
    volumes:
      - db_storage:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=admin
      - POSTGRES_USER=admin
      - POSTGRES_DB=n8n 
    healthcheck:
      test: ['CMD-SHELL','pg_isready -h localhost -U admin -d n8n']
      interval: 5s 
      timeout: 5s 
      retries: 10
    networks:
      - router

  task-runners:
    image: n8nio/runners:1.121.0
    container_name: n8n-runners
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-main:5679
      - N8N_RUNNERS_AUTH_TOKEN=secrets
    depends_on:
      - n8n
    networks:
      - router

volumes:
  n8n_data: {}
  db_storage: {}

networks:
  router:
    external: true
