
services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env 
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5432:5432 
    networks:
      - database

networks:
  database:
    driver: bridge

volumes:
  postgres_data: {}