
services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env 
    volumes:
      - /backup/data/postgres:/var/lib/postgresql/18/docker
    ports:
      - 5432:5432 
    networks:
      - database

networks:
  database:
    driver: bridge

volumes:
  posgres_data: {}
